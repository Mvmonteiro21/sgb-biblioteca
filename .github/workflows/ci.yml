name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 1. Instalar dependências
        run: pip install -r requirements.txt

      - name: 2. Linter e formatador
        run: |
          ruff check .
          ruff format --check .

      - name: 3. Testes
        run: pytest -q
